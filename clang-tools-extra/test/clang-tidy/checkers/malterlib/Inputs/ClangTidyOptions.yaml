# The bit scans that require an argument that isn't zero, and the macros that
# check, or let the analyzer assume, that a value is.
malterlib-no-zero-bit-scan.Functions:
  - fg_GetHighestBitSetNoZero
  - fg_GetLowestBitSetNoZero
  - fg_MostSignificantBitNoZero
  - fg_LeastSignificantBitNoZero
malterlib-no-zero-bit-scan.CheckMacros:
  - DMibCheck
  - DMibFastCheck
  - DMibSafeCheck
  - DMibRequire
malterlib-no-zero-bit-scan.AssumeMacros:
  - DMibAnalyzerAssume
